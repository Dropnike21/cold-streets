name: Resolve Flutter dependency lockfile (dev only)

on:
  push:
    branches:
      - feature/flutter-supabase-auth-20261104
    paths:
      - pubspec.yaml
      - .github/workflows/resolve-flutter-lockfile.yml

permissions:
  contents: write

jobs:
  resolve-lock:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: stable
      - name: Resolve Flutter dependencies (no build or tests)
        run: flutter pub get
      - name: Commit lockfile only to the development branch
        run: |
          if git diff --quiet -- pubspec.lock; then
            echo "pubspec.lock is current"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pubspec.lock
          git commit -m "chore(flutter): regenerate dependency lockfile"
          git push origin HEAD:refs/heads/feature/flutter-supabase-auth-20261104
